<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌詞で学ぶ 日本語</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--surface:#1a1a22;--card:#22222e;--border:#2e2e3e;
  --accent:#8b7cf8;--accent-soft:#2a2540;
  --text:#e8e6f0;--sub:#9090a8;--muted:#5a5a72;
  --n5:#4caf7d;--n4:#5b9bd5;--n3:#e6a817;--n2:#e07050;--n1:#cc4444;
  --green:#3a4a3a;--green-b:#4caf7d;
}
body{font-family:'Segoe UI','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* ─ Sidebar ─ */
#sidebar{width:260px;min-width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s,min-width .25s}
#sidebar.collapsed{width:40px;min-width:40px}
#sidebar.collapsed #sb-content{display:none}
#sidebar.collapsed #sb-toggle-icon{transform:rotate(180deg)}
#sb-head{padding:12px 10px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;cursor:pointer}
#sb-head-text{flex:1;min-width:0}
#sb-toggle{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
#sb-toggle:hover{background:var(--card);color:var(--text)}
#sb-toggle-icon{font-size:10px;transition:transform .25s;display:inline-block}
#sb-head h1{font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.4px}
#sb-head p{font-size:11px;color:var(--sub);margin-top:3px}
#prog-wrap{margin-top:10px}
#prog-label{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:4px}
#prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
#prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
#song-list{overflow-y:auto;flex:1;padding:6px 0}
.s-item{padding:9px 14px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;transition:background .15s,border-color .15s}
.s-item:hover{background:var(--card)}
.s-item.active{background:var(--accent-soft);border-left-color:var(--accent)}
.s-info{flex:1;min-width:0}
.s-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-meta{font-size:11px;color:var(--sub);margin-top:2px;display:flex;gap:6px;align-items:center}
.s-ring{width:28px;height:28px;flex-shrink:0}
.lv-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.lv-N5{background:#1a3a2a;color:var(--n5)}.lv-N4{background:#1a2a3a;color:var(--n4)}
.lv-N3{background:#3a2a10;color:var(--n3)}.lv-N2{background:#3a2010;color:var(--n2)}
.lv-N1{background:#3a1010;color:var(--n1)}

/* ─ Main ─ */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#m-head{padding:18px 26px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
#head-top{display:flex;gap:18px;align-items:flex-start}
#head-info{flex:1;min-width:0}
#song-name{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#song-artist{font-size:13px;color:var(--sub);margin-top:5px}
#dist-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;width:140px;gap:1px;margin-top:8px}
#dist-bar span{height:100%}

/* ─ Tabs ─ */
#tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.tab{padding:10px 22px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--sub);transition:color .15s,border-color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ─ Lyrics ─ */
#lyrics-view{flex:1;overflow-y:auto;padding:24px 28px;display:none}
#lyrics-view.show{display:block}
ruby{ruby-align:center}
rt{font-size:.62em;color:var(--sub);font-family:'Noto Sans JP',sans-serif}
.lyric-block{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.lyric-block:last-child{border-bottom:none}
.lyric-ja{font-size:16px;line-height:2.2;font-family:'Noto Sans JP','Noto Sans TC',sans-serif;color:var(--text)}
.lyric-zh{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.6}
.lyric-single{font-size:14px;color:var(--muted);font-style:italic;padding:6px 0}

/* ─ Grammar ─ */
#grammar-view{flex:1;overflow-y:auto;padding:22px 26px;display:none;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-content:start}
#grammar-view.show{display:grid}
.g-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.g-card:hover{border-color:var(--accent)}
.g-card.learned{background:var(--green);border-color:var(--green-b)}
.g-card.learned .g-pattern{color:#7dbf8a}
.g-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.g-pattern{font-size:17px;font-weight:600;color:var(--accent);font-family:'Noto Sans JP',sans-serif;line-height:1.3}
.g-badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;margin-left:8px;flex-shrink:0}
.g-example{font-size:13px;line-height:1.7;background:rgba(255,255,255,.04);border-radius:5px;padding:7px 11px;margin-bottom:9px;border-left:3px solid var(--accent);font-family:'Noto Sans JP',sans-serif}
.g-card.learned .g-example{border-left-color:var(--green-b)}
.g-meaning{font-size:12px;color:var(--sub);line-height:1.6}
.g-check{position:absolute;bottom:12px;right:14px;font-size:11px;color:var(--sub);display:flex;align-items:center;gap:3px;opacity:.55}
.g-card.learned .g-check{color:var(--n5);opacity:1}
.g-chk-icon{width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:8px}
#empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px;grid-column:1/-1}

/* ─ Artist tree ─ */
.artist-group{}
.artist-hd{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;user-select:none;transition:background .15s;border-bottom:1px solid var(--border)}
.artist-hd:hover{background:var(--card);color:var(--text)}
.artist-hd.open{color:var(--accent)}
.artist-arrow{font-size:8px;transition:transform .2s;display:inline-block;flex-shrink:0}
.artist-hd.open .artist-arrow{transform:rotate(90deg)}
.artist-songs{overflow:hidden}
.artist-songs.closed{display:none}
.s-item{padding:7px 12px 7px 34px}

/* ─ Home ─ */
#home-view{flex:1;overflow-y:auto;padding:28px 32px;display:none}
#home-view.show{display:block}
.home-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.home-sub{font-size:13px;color:var(--sub);margin-bottom:22px}
.home-total{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:24px}
.home-nums{font-size:28px;font-weight:700;color:var(--accent);margin-bottom:8px}
.home-section{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;margin:22px 0 10px}
.artist-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ac{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;cursor:pointer;transition:border-color .2s}
.ac:hover{border-color:var(--accent)}
.ac-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px}
.ac-meta{font-size:11px;color:var(--sub);margin-bottom:11px}
.ac-pl{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:4px}
.ac-pb{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:10px}
.ac-pf{height:100%;background:var(--accent);border-radius:2px}
.ac-dist{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:1px}
.ac-dist span{height:100%}

/* scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ─ Mobile ─ */
#mob-bar{display:none}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
@media(max-width:700px){
  body{flex-direction:column}
  #sidebar{position:fixed;top:0;left:-280px;width:280px;min-width:280px;height:100%;z-index:100;transition:left .25s,width .25s,min-width .25s;box-shadow:4px 0 24px rgba(0,0,0,.4)}
  #sidebar.mobile-open{left:0}
  #sidebar.collapsed{width:280px;min-width:280px}
  #sidebar.collapsed #sb-content{display:flex;flex-direction:column;flex:1;overflow:hidden}
  #sb-toggle{display:none}
  #overlay{display:block}
  #overlay.hidden{display:none}
  #main{width:100%;height:100vh}
  #mob-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  #mob-menu{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--sub);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  #mob-title{font-size:13px;font-weight:600;color:var(--accent);flex:1}
  #mob-prog{font-size:11px;color:var(--sub)}
  #m-head{padding:10px 14px 8px}
  #head-top{flex-direction:column;gap:8px}
  #song-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  #song-artist{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #yt-wrap{width:100%}
  #yt-wrap a{width:100%!important;display:block}
  #yt-wrap img{width:100%!important;height:auto!important}
  #tab-bar .tab{padding:10px 16px;font-size:13px}
  #lyrics-view{padding:16px}
  #grammar-view{padding:14px 12px;grid-template-columns:1fr}
  #home-view{padding:16px}
  .artist-cards{grid-template-columns:1fr}
  .home-total{padding:14px 16px}
}
</style>
</head>
<body>

<nav id="sidebar">
  <div id="sb-head" onclick="renderHome()" title="回首頁">
    <div id="sb-head-text">
      <h1>🎵 歌詞で学ぶ 日本語</h1>
      <p>透過歌詞學習日文文法</p>
    </div>
    <button id="sb-toggle" onclick="event.stopPropagation();toggleSidebar()" title="收起側欄">
      <span id="sb-toggle-icon">◀</span>
    </button>
  </div>
  <div id="sb-content">
    <div id="prog-wrap" style="padding:10px 16px 8px;border-bottom:1px solid var(--border)">
      <div id="prog-label"><span>文法進度</span><span id="prog-txt">0 / 0</span></div>
      <div id="prog-bar"><div id="prog-fill" style="width:0%"></div></div>
    </div>
    <div id="song-list"></div>
  </div>
</nav>

<div id="overlay" class="hidden" onclick="closeMobileSidebar()"></div>

<main id="main">
  <div id="mob-bar">
    <button id="mob-menu" onclick="openMobileSidebar()">☰</button>
    <span id="mob-title" onclick="renderHome()" style="cursor:pointer">🎵 歌詞で学ぶ 日本語</span>
    <span id="mob-prog"></span>
  </div>
  <div id="m-head">
    <div id="head-top">
      <div id="head-info">
        <div id="song-name">← 請選擇一首歌</div>
        <div id="song-artist"></div>
        <div id="dist-bar"></div>
      </div>
      <div id="yt-wrap" style="display:none;width:260px;flex-shrink:0">
        <div id="yt-player-box" style="border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/9"></div>
        <a id="yt-fallback" href="#" target="_blank" rel="noopener" style="display:none;position:relative;border-radius:8px;overflow:hidden;text-decoration:none">
          <img id="yt-thumb" src="" style="display:block;width:100%;border-radius:8px">
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.45);gap:6px">
            <div style="width:44px;height:44px;background:#ff0000;border-radius:50%;display:flex;align-items:center;justify-content:center">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="white"><polygon points="9,7 19,12 9,17"/></svg>
            </div>
            <span style="color:#fff;font-size:11px;font-weight:500">無法嵌入・在 YouTube 觀看</span>
          </div>
        </a>
      </div>
    </div>
  </div>
  <div id="tab-bar">
    <div class="tab active" onclick="switchTab('lyrics')">歌詞</div>
    <div class="tab" onclick="switchTab('grammar')">文法</div>
  </div>
  <div id="lyrics-view"><div style="padding:60px 20px;text-align:center;color:var(--sub)">從左側選擇歌曲</div></div>
  <div id="grammar-view"><div id="empty">從左側選擇歌曲，開始學習文法句型</div></div>
  <div id="home-view"></div>
</main>

<script>

/* ── Furigana parser ── */
function ruby(text) {
  // 漢字(ふりがな) → <ruby>漢字<rt>ふりがな</rt></ruby>
  return text
    .replace(/\\/g, '') // strip markdown escapes
    .replace(/([^\s(（【〔「」『』()）\[\]]+)\(([^()（）]+)\)/g,
      (m, kanji, furi) => {
        // Only if furi is hiragana/katakana (not Chinese or English)
        if (/^[぀-ヿㇰ-ㇿ･-ﾟ]+$/.test(furi)) {
          return `<ruby>${kanji}<rt>${furi}</rt></ruby>`;
        }
        return m; // keep as-is (Chinese in parens, English notes, etc.)
      });
}

/* ── Parse raw lyrics string → [{ja, zh}] ── */
function parseLyrics(raw) {
  const results = [];
  const blocks = raw.trim().split(/\n\n+/);
  for (const block of blocks) {
    const lines = block.split('\n').map(l => l.trim()).filter(l => l);
    if (!lines.length) continue;
    if (lines.length >= 2) results.push({ja: lines[0], zh: lines[1]});
    else results.push({ja: lines[0], zh: ''});
  }
  return results;
}

/* ── State ── */
let learned = JSON.parse(localStorage.getItem(LKEY) || '{}');
let cur = null, curTab = 'lyrics';
const openArtists = new Set(SONGS.map(s => s.artist));

function lk(sid, gid){ return sid+'_'+gid; }
function isL(sid, gid){ return !!learned[lk(sid,gid)]; }
function toggleL(sid, gid){
  const k = lk(sid,gid);
  if (learned[k]) delete learned[k]; else learned[k] = true;
  localStorage.setItem(LKEY, JSON.stringify(learned));
}
function songDone(s){ return s.grammar.filter(g=>isL(s.id,g.id)).length; }
function totalDone(){ return SONGS.reduce((a,s)=>a+songDone(s),0); }
function totalAll(){ return SONGS.reduce((a,s)=>a+s.grammar.length,0); }

/* ── Sort: numbers → English → 50-on ── */
function songRank(title) {
  const c = title.codePointAt(0);
  if (c >= 0x30 && c <= 0x39) return 0;
  if ((c >= 0x41 && c <= 0x5A)||(c >= 0x61 && c <= 0x7A)||(c >= 0xFF21 && c <= 0xFF5A)) return 1;
  return 2;
}
function sortSongs(arr) {
  return [...arr].sort((a,b) => {
    const ra = songRank(a.title), rb = songRank(b.title);
    if (ra !== rb) return ra - rb;
    return a.title.localeCompare(b.title, 'ja');
  });
}

/* ── Group by artist ── */
function groupByArtist() {
  const g = {};
  SONGS.forEach(s => { if (!g[s.artist]) g[s.artist]=[]; g[s.artist].push(s); });
  Object.keys(g).forEach(a => { g[a] = sortSongs(g[a]); });
  return g;
}

/* ── Mini ring SVG ── */
function ring(d, t, size=24, sw=2) {
  const R=(size-sw*2)/2, C=2*Math.PI*R, pct=t?d/t:0;
  const dash=(pct*C).toFixed(1), gap=((1-pct)*C).toFixed(1), off=(C/4).toFixed(1);
  const rc = d===t&&t>0?'#4caf7d':'#8b7cf8';
  const cx=size/2, fs=size*0.27;
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0">
    <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#2e2e3e" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${rc}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    <text x="${cx}" y="${cx}" text-anchor="middle" dominant-baseline="central"
      fill="${rc}" font-size="${fs}" font-family="sans-serif">${d}/${t}</text>
  </svg>`;
}

/* ── Render sidebar (tree) ── */
function renderSidebar() {
  const done = totalDone(), all = totalAll();
  document.getElementById('prog-txt').textContent = done+' / '+all;
  document.getElementById('prog-fill').style.width = (all ? Math.round(done/all*100) : 0)+'%';
  updateMobBar();
  const list = document.getElementById('song-list');
  list.innerHTML = '';
  const groups = groupByArtist();
  Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ja')).forEach(artist => {
    const songs = groups[artist];
    const aDone = songs.reduce((a,s)=>a+songDone(s),0);
    const aAll = songs.reduce((a,s)=>a+s.grammar.length,0);
    const isOpen = openArtists.has(artist);
    const grp = document.createElement('div');
    grp.className = 'artist-group';
    grp.dataset.artist = artist;
    const hd = document.createElement('div');
    hd.className = 'artist-hd'+(isOpen?' open':'');
    hd.innerHTML = `<span class="artist-arrow">▶</span>
      <span style="flex:1">${artist}</span>
      <span style="font-size:10px;opacity:.6">${aDone}/${aAll}</span>`;
    hd.onclick = () => {
      if (openArtists.has(artist)) openArtists.delete(artist); else openArtists.add(artist);
      renderSidebar();
    };
    const sd = document.createElement('div');
    sd.className = 'artist-songs'+(isOpen?'':' closed');
    songs.forEach(s => {
      const d = songDone(s), t = s.grammar.length;
      const el = document.createElement('div');
      el.className = 's-item'+(cur&&cur.id===s.id?' active':'');
      el.innerHTML = ring(d,t)+`<div class="s-info">
        <div class="s-title">${s.title}</div>
        <div class="s-meta"><span class="lv-badge" style="background:${DC[s.level]};color:${TC[s.level]}">${s.level}</span></div>
      </div>`;
      el.onclick = () => selectSong(s);
      sd.appendChild(el);
    });
    grp.appendChild(hd); grp.appendChild(sd);
    list.appendChild(grp);
  });
}

  const view = document.getElementById('lyrics-view');
  const raw = LR[s.id];
  if (!raw) { view.innerHTML='<div style="padding:40px 20px;color:var(--sub);text-align:center">歌詞資料尚未加入</div>'; return; }
  const pairs = parseLyrics(raw);
  view.innerHTML = pairs.map(p => {
    const jaHtml = ruby(p.ja);
    if (!p.zh) return `<div class="lyric-block"><div class="lyric-ja lyric-single">${jaHtml}</div></div>`;
    return `<div class="lyric-block">
      <div class="lyric-ja">${jaHtml}</div>
      <div class="lyric-zh">${p.zh}</div>
    </div>`;
  }).join('');
}

/* ── Render grammar ── */
function renderGrammar(s) {
  const view = document.getElementById('grammar-view');
  view.innerHTML = '';
  s.grammar.forEach(g => {
    const lnd = isL(s.id, g.id);
    const card = document.createElement('div');
    card.className = 'g-card'+(lnd?' learned':'');
    card.innerHTML = `
      <div class="g-top">
        <div class="g-pattern">${g.pattern}</div>
        <span class="g-badge lv-${g.level}" style="background:${DC[g.level]};color:${TC[g.level]}">${g.level}</span>
      </div>
      <div class="g-example">${ruby(g.example)}</div>
      <div class="g-meaning">${g.meaning}</div>
      <div class="g-check">
        <div class="g-chk-icon">${lnd?'✓':''}</div>
        ${lnd?'已學會':'點擊標記'}
      </div>`;
    card.onclick = () => {
      toggleL(s.id, g.id);
      renderGrammar(s);
      renderSidebar();
    };
    view.appendChild(card);
  });
}

/* ── Select song ── */
function selectSong(s) {
  cur = s;
  closeMobileSidebar();
  document.getElementById('home-view').classList.remove('show');
  document.getElementById('m-head').style.display = '';
  document.getElementById('tab-bar').style.display = '';
  renderHeader(s);
  renderLyrics(s);
  renderGrammar(s);
  switchTab(curTab);
  renderSidebar();
}

/* ── YouTube IFrame API ── */
var ytPlayer = null, ytReady = false, pendingVid = null;
(function(){
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();

function onYouTubeIframeAPIReady() {
  ytReady = true;
  if (pendingVid) { _createPlayer(pendingVid); pendingVid = null; }
}

function loadYouTubePlayer(videoId) {
  document.getElementById('yt-player-box').style.display = '';
  document.getElementById('yt-fallback').style.display = 'none';
  if (!ytReady) { pendingVid = videoId; return; }
  if (ytPlayer) {
    ytPlayer.loadVideoById(videoId);
  } else {
    _createPlayer(videoId);
  }
}

function _createPlayer(videoId) {
  document.getElementById('yt-player-box').innerHTML = '';
  ytPlayer = new YT.Player('yt-player-box', {
    width: '100%', height: '100%',
    videoId: videoId,
    playerVars: {rel: 0, modestbranding: 1},
    events: {
      onError: function(e) {
        if (e.data === 101 || e.data === 150 || e.data === 100) {
          document.getElementById('yt-player-box').style.display = 'none';
          var fb = document.getElementById('yt-fallback');
          fb.href = 'https://www.youtube.com/watch?v=' + videoId;
          document.getElementById('yt-thumb').src = 'https://img.youtube.com/vi/' + videoId + '/mqdefault.jpg';
          fb.style.display = 'block';
        }
      }
    }
  });
}

/* ── Init ── */
renderHome();
